<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spire VPN</title>
    <!-- Подключаем Telegram Web Apps API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #181818);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            background: var(--tg-theme-secondary-bg-color, #242424);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        h1 {
            color: var(--tg-theme-button-color, #2481cc);
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 30px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 15px;
        }
        button:active {
            opacity: 0.8;
        }
        .key-box {
            display: none;
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 6px;
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
            border: 1px solid #444;
            margin-top: 15px;
        }
        .status {
            margin-top: 10px;
            font-weight: bold;
            color: #4cd964;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Spire VPN</h1>
    <div class="subtitle">Приложение для управления доступом</div>

    <button id="get-key-btn">🔑 Получить новый ключ</button>
    <button id="activate-btn" style="background-color: #34c759;">⚡ Активировать VPN</button>

    <div id="key-display" class="key-box"></div>
    <div id="status-display" class="status" style="display: none;"></div>
</div>

<script>
    // Инициализация Telegram Web App
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // Расширяем на весь экран

    const getKeyBtn = document.getElementById('get-key-btn');
    const activateBtn = document.getElementById('activate-btn');
    const keyDisplay = document.getElementById('key-display');
    const statusDisplay = document.getElementById('status-display');

    // Хэндлер для получения ключа
    getKeyBtn.addEventListener('click', () => {
        // Имитация генерации ключа (например, VLESS)
        const mockKey = "vless://spire-vpn-" + Math.random().toString(36).substring(2, 15) + "@127.0.0.1:443?security=reality";
        
        keyDisplay.innerText = mockKey;
        keyDisplay.style.display = 'block';
        statusDisplay.style.display = 'none';

        // Вибрация на смартфоне ( haptic feedback )
        if (tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
        }
    });

    // Хэндлер для активации
    activateBtn.addEventListener('click', () => {
        if(keyDisplay.innerText === "") {
            alert("Сначала получите ключ!");
            return;
        }
        
        statusDisplay.innerText = "VPN успешно активирован! Куда летим?";
        statusDisplay.style.display = 'block';

        // Отправляем данные обратно в бота и закрываем окно (опционально)
        setTimeout(() => {
            tg.sendData("Пользователь активировал ключ: " + keyDisplay.innerText);
            tg.close();
        }, 1500);
    });
</script>
</body>
</html>
